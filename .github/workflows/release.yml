name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go tool mygo vet .
      # Uploads to a draft release, which you publish after looking at it.
      # shortcut: macOS apps are signed ad hoc, add docs/github-actions.md's signing steps once there is a Developer ID.
      - name: Build and upload
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
